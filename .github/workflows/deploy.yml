name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  extract-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          if [ -f rede-jovem-saas.zip ]; then
            unzip -o rede-jovem-saas.zip
            rm rede-jovem-saas.zip
          fi

      - name: Fix vite.config for GitHub Pages
        run: |
          sed -i "s/defineConfig({/defineConfig({\n  base: '\/Rede-Jovem-CPNA\/',/" frontend/vite.config.ts

      - name: Fix asset paths for GitHub Pages
        run: |
          sed -i "s|src=\"/logo-rede-jovem.png\"|src=\"/Rede-Jovem-CPNA/logo-rede-jovem.png\"|g" frontend/src/components/layout/AppLayout.tsx
          sed -i "s|href=\"/favicon.png\"|href=\"/Rede-Jovem-CPNA/favicon.png\"|g" frontend/index.html

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Create env file
        working-directory: frontend
        run: cp .env.example .env 2>/dev/null || true

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
